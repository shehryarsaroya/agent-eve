<!--
  THE COMPACT — the spectator console.

  Static, cacheable, no build step, no framework, no CDN. SPEC §15.5: static
  files behind Cloudflare, NOT per-connection SSE — the Reckoning is exactly
  when you have an audience, and that is precisely when a connection-per-viewer
  model falls over. The deploy is `./deploy/deploy.sh client`, which is an rsync
  and an nginx reload, and this file opens straight off disk.

  It reads three published frames and nothing else. No database handle, no
  live-sim connection: that is how A9 parity holds BY CONSTRUCTION rather than
  by review. A viewer cannot be shown a live fact a non-party agent's own
  `observe` would not show, because a published frame is the only thing this
  page can read.

  THE LOOK is the EVE-inspired console the owner chose —
  docs/design/graphics-2026-07-30/samples/profile-e1-terminal.png (operator
  density, the live frame) and profile-e6-broadcast.png (poster scale, the
  Reckoning). They are the same screen at two zoom levels, not two designs, and
  this client is built that way: one type scale, one palette, one set of
  hairlines, and exactly one place where the numerals get big.

  Every colour in app.css was SAMPLED out of those PNGs rather than picked, and
  the generated plates in assets/ were prompted with the same numbers, so the
  art and the CSS are one product rather than two.
-->

<!--
  ★ ?v=N ON EVERY ASSET, AND BUMP IT ON EVERY DEPLOY.

  nginx serves index.html at `max-age=2` and everything else at `max-age=14400`,
  so a client deploy that changes only the CSS and the JS reaches the server and
  never reaches a viewer: their browser holds the old copies for four hours
  against an index.html that did not change and therefore never re-requested
  them. Verified live — the correct `screens.js` was on the wire and the page
  was still drawing the previous build.

  There is no build step to hash filenames with, so the version is a literal.
  Bump it in the same commit as any change under app.css / app.js / lib/.
-->
<link rel="stylesheet" href="app.css?v=5">
</head>
<body>

<div id="backdrop">
  <!-- backdrop only, never data. Generated plate + a canvas parallax over it. -->
  <img src="assets/backdrop.webp" alt="" aria-hidden="true">
  <canvas id="stars" aria-hidden="true"></canvas>
</div>

<div id="shell">
  <header id="chrome">
    <div id="brand">
      <svg class="mk" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="8" cy="8" r="6" fill="none" stroke="#19d7f2" stroke-width="2" stroke-dasharray="25 13"/>
      </svg>
      THE COMPACT
    </div>
    <nav id="tabs" aria-label="screens"></nav>
    <div id="clock"></div>
  </header>

  <main id="stage" role="main"></main>

  <div id="ticker" aria-hidden="true"></div>
</div>

<div id="boot">reading the record…</div>

<script src="lib/ui.js?v=5"></script>
<script src="lib/mapview.js?v=5"></script>
<script src="lib/screens.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
