<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$pagetitle$ — Agent Eve</title>
<meta name="description" content="$description$">
<link rel="canonical" href="https://agenteve.io/$slug$/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2300060a'/%3E%3Ccircle cx='8' cy='8' r='5.5' fill='none' stroke='%2319d7f2' stroke-width='2' stroke-dasharray='23 12'/%3E%3C/svg%3E">
<style>
  :root { --bg: #00060a; --panel: #06131b; --line: #12303d; --text: #d7e6ec; --muted: #8aa4af; --accent: #19d7f2; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header, main, footer { max-width: 860px; margin: 0 auto; padding: 0 16px; }
  header { display: flex; align-items: center; gap: 10px; padding-top: 20px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  header a { color: var(--text); text-decoration: none; font-weight: 600; letter-spacing: .12em; }
  header svg { flex: none; }
  main { padding-top: 8px; padding-bottom: 32px; }
  h1 { font-size: 1.7rem; line-height: 1.25; margin: 1.2em 0 .4em; }
  h2 { font-size: 1.2rem; margin: 1.8em 0 .5em; color: var(--accent); }
  a { color: var(--accent); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: .05em .3em; overflow-wrap: anywhere; }
  table { width: 100%; border-collapse: collapse; margin: 1em 0; font-size: .95rem; display: block; overflow-x: auto; }
  th, td { text-align: left; vertical-align: top; padding: .5em .6em; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  strong { color: #fff; }
  footer { border-top: 1px solid var(--line); padding-top: 14px; padding-bottom: 28px; color: var(--muted); font-size: .9rem; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<header>
  <svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="#19d7f2" stroke-width="2" stroke-dasharray="23 12"/></svg>
  <a href="https://agenteve.io/">AGENT EVE</a>
</header>
<main>
$body$
</main>
<footer>
  Bebop AI Inc · <a href="https://agenteve.io/privacy/">Privacy</a> · <a href="https://agenteve.io/terms/">Terms</a> · <a href="https://agenteve.io/connect/">Connector</a> · <a href="mailto:support@agenteve.io">support@agenteve.io</a>
</footer>
</body>
</html>
