# mcp.agenteve.io — Agent Eve's MCP connector (connector/, agenteve-mcp.service).
#
# Installed by deploy/deploy-mcp.py as /etc/nginx/sites-available/mcp.agenteve.io with
# @SUPABASE_ORIGIN@ replaced by the Supabase project origin (https://<ref>.supabase.co).
# Fresh names only: it touches nothing of agenteve.io's vhost, and it is `nginx -t`-checked
# before any reload because this box serves other tenants' sites.

server {
    listen 80;
    listen [::]:80;
    server_name mcp.agenteve.io;
    root /var/www/mcp.agenteve.io;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcp.agenteve.io;
    ssl_certificate /etc/letsencrypt/live/mcp.agenteve.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.agenteve.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    root /var/www/mcp.agenteve.io;
    client_max_body_size 256k;
    access_log /var/log/nginx/mcp.agenteve.io.access.log;
    error_log /var/log/nginx/mcp.agenteve.io.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Cloudflare's published networks, as on agenteve.io: X-Real-IP below is then the caller's
    # address as Cloudflare saw it (for chat hosts, their egress), used only for the anonymous
    # spectator rate limit.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # The MCP endpoint, its RFC 9728 discovery document, and the consent page's account lookup.
    location ~ ^/(mcp|account)$ {
        proxy_pass http://127.0.0.1:8825;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # The engine's gateway headers mean nothing here; never forward a caller's copy.
        proxy_set_header X-Eve-Gateway-Account "";
        proxy_set_header X-Eve-Gateway-Time "";
        proxy_set_header X-Eve-Gateway-Mac "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:8825;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cross-device sign-in handoffs (connector/src/auth/handoff.ts): the popup opens one and polls
    # it; the confirm page posts the person's "Yes, it's me". Longer than /oauth/, so it wins. The
    # service marks every reply no-store; no add_header here, so the server-level headers apply.
    location ^~ /oauth/handoff {
        proxy_pass http://127.0.0.1:8825;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Eve-Gateway-Account "";
        proxy_set_header X-Eve-Gateway-Time "";
        proxy_set_header X-Eve-Gateway-Mac "";
    }
    # Where every sign-in email's link lands, on whatever device the person opens it: the person
    # types the word the sign-in page shows. Same headers and CSP as the consent page. Its URL holds a
    # one-time sign-in token, so it is kept out of the access log (this box is shared) and out of any
    # Referer (here and in the page itself).
    location = /oauth/confirm {
        access_log off;
        default_type text/html;
        try_files /oauth/confirm.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' @SUPABASE_ORIGIN@; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }
    location = /oauth/confirm.html {
        return 404;
    }

    # The consent page Supabase's OAuth server sends people to: Site URL + /oauth/consent.
    location = /oauth/consent {
        default_type text/html;
        try_files /oauth/consent.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' @SUPABASE_ORIGIN@; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }
    # The page file itself is served ONLY through /oauth/consent above, with its frame and CSP
    # headers; reaching it by its file name under /oauth/ would skip them (add_header does not
    # inherit into a location that sets its own).
    location = /oauth/consent.html {
        return 404;
    }
    # Module scripts are refused unless served as JavaScript, and older mime.types lack .mjs.
    location ^~ /oauth/ {
        types { application/javascript js mjs; text/css css; text/html html; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /vendor/ {
        types { application/javascript js mjs; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = / {
        try_files /index.html =404;
    }
    # OpenAI's domain-verification file for the plugin submission: the token is issued during
    # submission and dropped into /var/www/mcp.agenteve.io/.well-known/ (connector/SUBMISSION.md).
    location = /.well-known/openai-apps-challenge {
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}

# The public frames, for the connector's spectator tools, on loopback only: the frames
# directory is readable by nginx (www-data) and deliberately not by the agenteve-mcp user.
server {
    listen 127.0.0.1:8826;
    server_name _;
    access_log off;
    location /frames/ {
        alias /var/lib/agenteve/frames/;
        default_type application/json;
        add_header Cache-Control no-store always;
    }
    location / {
        return 404;
    }
}
