# agenttransfer.dev — THE GAME, and nothing else.
#
# Was an INCLUDE fragment (`snippets/compact.conf`) bolted into the
# agentinsurance.io vhost, serving the game from a /compact/ subdirectory of
# somebody else's landing page. On 2026-08-02 the game got its own host and the
# fragment became this: a whole vhost, with the game at the root.
#
# Everything below the server block is the fragment's own text with the
# /compact/ prefix taken out. The comments are kept verbatim because each one
# records a bug that was paid for once — especially the alias-under-a-regex
# note and the reason every frame file needs its own exact-match block.
#
# THE API IS THE SIGNING SURFACE. Agents sign @path and @authority (RFC 9421),
# so `location /api/` and the engine's API_BASE_PATH must agree exactly. If you
# change one, change the other, or every signed request 401s with a @path
# mismatch that lists the spellings we checked.

server {
    server_name agenttransfer.dev www.agenttransfer.dev;
    root /var/www/agenttransfer.dev;
    index index.html;

    access_log /var/log/nginx/agenttransfer.dev.access.log;
    error_log  /var/log/nginx/agenttransfer.dev.error.log;

    # Real client IP from Cloudflare
    set_real_ip_from 173.245.48.0/20;  set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;  set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;  set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;  set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22; set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;   set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # AGENT TRANSFER — the game's location blocks. (What follows was the /compact/
    # include fragment, prefix stripped; the header at the top of this file has the
    # history. Its old self-description — "kept as a separate snippet, installed at
    # /etc/nginx/snippets/compact.conf" — is deleted rather than kept-verbatim,
    # because it described an arrangement this file exists to replace.)

    # ── The spectator client: static, cacheable frames ──────────────────────────
    #
    # SPEC §15.5: static cacheable files behind Cloudflare, NOT per-connection SSE.
    # The Reckoning is exactly when you have an audience, and that is precisely when
    # a connection-per-viewer model falls over. max-age=2 is short enough that the
    # tick feels live and long enough that a spike collapses into one origin fetch.
    # `root` from the server block, NOT `alias`. The fragment this came from used an
    # alias because it was mounted at /compact/ and had to map a URI prefix onto a
    # directory that did not share its name. At the root those are the same thing, and
    # `alias` on a prefix `location /` is a documented nginx footgun — it interacts badly
    # with try_files and the SPA fallback below.
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "public, max-age=2" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # agent.md is the rules surface an agent plays from. Served as UTF-8 text/plain so a
    # probe's HTTP client reads it rather than offering it as a download, and matched BEFORE
    # the SPA fallback so a missing file 404s honestly instead of returning index.html with
    # a 200 — that fallback once made a probe fetch a web page and try to parse it as rules.
    location = /agent.md {
        alias /var/www/agenttransfer.dev/agent.md;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=60" always;
    }

    # Frame JSON is the highest-volume object during a Reckoning, and it comes in two
    # kinds that must NOT be cached the same way.
    #
    # ── TWO BUGS LIVED HERE, AND BOTH SILENTLY BROKE THE SHOW ───────────────────
    #
    # 1. `alias` under a REGEX location. nginx only appends the remaining URI for a
    #    prefix location; with a regex it treats the alias as the whole path unless the
    #    alias carries captures. So `/frames/latest.json` resolved to the
    #    directory, failed, and fell through to the SPA — the client polled for a frame
    #    and was handed `index.html` with a 200. The frames were being written correctly
    #    the whole time and no viewer could reach one. `root` is the right directive
    #    here precisely because it DOES append the full URI.
    #
    # 2. `immutable`, for a year, on a file that is overwritten every Reckoning.
    #    `r-000000.json` is genuinely immutable — a settled tick never changes — but
    #    `latest.json` is a moving pointer at the newest one. Cached hard, a viewer who
    #    watched once would never see another Reckoning as long as the cache lived.
    #
    # Both were invisible from the server side: the file existed, the deploy verified,
    # and only fetching the URL the client actually fetches showed it.
    location = /frames/latest.json {
        root /var/www/agenttransfer.dev;
        default_type application/json;
        # Same 2 seconds as the client shell: long enough that a Reckoning-night spike
        # collapses into one origin fetch, short enough that the world still feels live.
        add_header Cache-Control "public, max-age=2" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/frames/r-[0-9]+\.json$ {
        root /var/www/agenttransfer.dev;
        default_type application/json;
        # A settled Reckoning never changes, so this one really is immutable.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # The archive's table of contents: which Reckonings exist, and — the fact nothing
    # published before — what each one's file is actually called.
    #
    # ── WHY THIS NEEDS ITS OWN BLOCK ────────────────────────────────────────────
    #
    # D23 #5 reported `frames/r-15.json` as a 404 and concluded the archive was not
    # served. It was: `frames/write.ts` pads to six digits, so the file is
    # `r-000015.json`, and the regex above matches both names while only one exists.
    # The archive was reachable and undiscoverable, which for a viewer is the same
    # thing — the client could see the latest night and had no way to learn there had
    # been sixteen before it.
    #
    # Without an exact-match block this URL falls to `location /`, whose
    # `try_files` ends at `/index.html` — so a missing index would return the
    # spectator page with a 200 and the client would parse HTML as JSON. That is bug
    # #1 above in a third costume, and the reason `agent.md` got its own block too.
    #
    # A MOVING file, not an immutable one: it grows a row every Reckoning, so it takes
    # `latest.json`'s two seconds rather than the archive's year.
    location = /frames/index.json {
        root /var/www/agenttransfer.dev;
        default_type application/json;
        add_header Cache-Control "public, max-age=2" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── ★ THE LIVE FRAME: the motion BETWEEN Reckonings ─────────────────────────
    #
    # ══════════════════════════════════════════════════════════════════════════════
    # **`latest.json` CHANGES ONCE EVERY 24 HOURS AND THE CLIENT POLLS IT EVERY 15 SECONDS.**
    #
    # `SPEEDS.prod` is 300 s and `TICKS_PER_RECKONING` is 288, so a Reckoning is exactly
    # 86,400 s. The nightly frame is therefore a post-mortem: `raidLines.ticksLeft` was 0
    # on 117 of 117 measured rows, `DEMANDED` never occurred on any frame, and the battle
    # `gap` — the most legible thing on the board — never once animated. A viewer arriving
    # at an arbitrary moment saw a still image of yesterday.
    #
    # `live.json` is rewritten once per tick. **Nothing about §15.5's delivery design
    # changes**: it is a static file behind Cloudflare, not a socket, and at `max-age=2`
    # one origin fetch every two seconds serves an audience of any size — which is the
    # property per-connection SSE would have destroyed *"because the Reckoning is exactly
    # when you have an audience"*.
    #
    # Its own exact-match block for `index.json`'s reason, which has now cost this file
    # three bugs in three costumes: without one, this URL falls to `location /`,
    # whose `try_files` ends at `/index.html` — so a missing file returns the
    # spectator page with a **200** and the client parses HTML as JSON.
    #
    # A MOVING file, so it takes `latest.json`'s two seconds and never the archive's year.
    # There is no `r-`-style archive of live frames on purpose: a mid-Reckoning tick is
    # motion, and its history is the ledger (`frames/write.ts:LIVE`).
    # ══════════════════════════════════════════════════════════════════════════════
    location = /frames/live.json {
        root /var/www/agenttransfer.dev;
        default_type application/json;
        add_header Cache-Control "public, max-age=2" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Off, unlike the two moving files above: this one is fetched 288 times more often
        # per Reckoning than they are, and a per-poll access log entry for every viewer is
        # the highest-volume line on the box for no operational signal at all — the frame's
        # own mtime already says when the show last moved.
        access_log off;
    }

    # ── The agent API ───────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8801/;
        proxy_http_version 1.1;

        # Agents are HTTP clients on unknown networks. Pass through what the app
        # needs to rate-limit correctly: the vhost already sets real_ip_header
        # CF-Connecting-IP, so $remote_addr is the true client here (SEC-5).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # RFC 9421 signatures cover specific headers; nginx must not rewrite them or
        # every signature fails verification for reasons an agent cannot debug.
        proxy_pass_request_headers on;

        # observe?wait=true is a long poll. The read timeout must exceed the longest
        # wait the app will hold, or the proxy severs it and the agent sees a
        # truncated response rather than a timeout it can reason about.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;

        # Never cache the agent surface. An agent acting on a cached observation is
        # acting on a stale state_version, which surfaces as spurious
        # expected_state_version mismatches — indistinguishable, from the agent's
        # side, from a counterparty reneging.
        add_header Cache-Control "no-store" always;
        proxy_cache_bypass 1;
    }

    # Health endpoint, deliberately outside /api/ so a monitor never needs a
    # signature. It asserts the *interesting* property (are agents deciding?), not
    # just liveness — scar #14b shipped a system that looked healthy for hours while
    # the LLM players had silently fallen back to heuristics.
    location = /health {
        proxy_pass http://127.0.0.1:8801/health;
        access_log off;
        add_header Cache-Control "no-store" always;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/agenttransfer.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agenttransfer.dev/privkey.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name agenttransfer.dev www.agenttransfer.dev;
    return 301 https://$host$request_uri;
}
