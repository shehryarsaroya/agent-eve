# THE COMPACT — OPS-1. WAL archiving so a restore is possible at all, plus
# settings that make DET-4 (identical hashes across hosts) hold here.
#
# Note the database itself was created with LC_COLLATE=C, which is the real fix
# for the Postgres locale-collation determinism killer (SPEC §15.5) — it makes
# the bug impossible rather than something every ORDER BY has to remember.

wal_level = replica
archive_mode = on
archive_command = 'test ! -f /var/lib/compact/wal-archive/%f && cp %p /var/lib/compact/wal-archive/%f'
archive_timeout = 300
max_wal_senders = 3
wal_keep_size = 512MB

# The tick is pure in-memory code and Postgres is journal + query surface
# (SPEC §15.5), so favour durability over write throughput.
synchronous_commit = on

# The event table is partitioned by tick range; keep planning cheap as
# partition count grows.
enable_partitionwise_join = on
enable_partitionwise_aggregate = on
