server {
    listen 80;
    listen [::]:80;
    server_name agenteve.io www.agenteve.io;
    root /var/www/agenteve.io;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agenteve.io www.agenteve.io;
    ssl_certificate /etc/letsencrypt/live/agenteve.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agenteve.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    root /opt/agenteve/client;
    index index.html;
    client_max_body_size 64k;
    access_log /var/log/nginx/agenteve.io.access.log;
    error_log /var/log/nginx/agenteve.io.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Cloudflare's published networks; arbitrary clients cannot spoof the rate-limit IP.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # The upstream signs the original host and path. Only this loopback proxy is trusted.
    location ~ ^/(api/|health$|agent\.md$) {
        proxy_pass http://127.0.0.1:8801;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        add_header Cache-Control no-store always;
    }
    location /frames/ {
        alias /var/lib/agenteve/frames/;
        default_type application/json;
        add_header Cache-Control no-store always;
    }
    location /mcp/ {
        alias /var/www/agenteve.io/mcp/;
        types { text/plain md; application/gzip gz; }
        charset utf-8;
        autoindex off;
        add_header Cache-Control "public, max-age=60";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=30";
    }
}
